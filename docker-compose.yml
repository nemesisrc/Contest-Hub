version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: contesthub-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: contesthub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: contesthub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: contesthub-backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/contesthub
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/contesthub
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=contesthub-jwt-secret-key-production-ready
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: contesthub-celery-worker
    command: celery -A backend.app.tasks.celery_tasks worker --loglevel=info
    environment:
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/contesthub
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: contesthub-celery-beat
    command: celery -A backend.app.tasks.celery_tasks beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - celery_worker

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: contesthub-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

volumes:
  postgres_data:
